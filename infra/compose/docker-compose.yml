# Start it with the Makefile from the repo root (Git Bash / WSL):
#   make up        core: app + engine + redis            http://localhost:3000 (app) · :8000 (engine)
#   make up-all    + obs: Prometheus :9090, Grafana :3001 (admin / admin -> dashboard "RecoSphere serving")
# Without make:  docker compose -f infra/compose/docker-compose.yml --env-file .env [--profile obs] up --build
#
# Profiles: services with NO profile are "core" and always start (compose has no default profile, and a
# profiled service cannot depend on a disabled one). Optional groups get a profile: obs now; stream (P3)
# and ml (P5) are added when those services exist.
# Config: every ${VAR:-default} below is listed in .env.example (repo root). The defaults are the values
# used before P0, so the stack behaves the same without a .env file.
# Paths are relative to THIS file (infra/compose/), which is how compose resolves them.
name: recosphere   # keep the project/volume names from when this file lived at the root

services:
  # ----------------------------------------------------------------------------------------- core
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      RANKFORGE_CATEGORY: ${RANKFORGE_CATEGORY:-Video_Games}
      REDIS_URL: redis://redis:6379/0
      NEW_ITEM_SLOTS: ${NEW_ITEM_SLOTS:-2}
      SERVE_THREADS: ${SERVE_THREADS:-1}
      API_WORKERS: ${API_WORKERS:-4}                 # one Python process ~ one core (GIL); about your core count
      MODEL_WATCH_SECONDS: ${MODEL_WATCH_SECONDS:-10}  # follow models/<cat>/production.json, hot-swap without restart
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}                  # optional: protects /admin/* on the engine
    volumes:
      - ../../data/gold:/app/data/gold:ro
      - ../../models:/app/models           # rw: the app's admin 'Roll back' rewrites production.json
      - ../../experiments:/app/experiments:ro      # Phase 8: experiments/active.yaml
      - ../../ab_logs:/app/ab_logs                 # Phase 8: exposure + click logs (written by the API)
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      redis:
        condition: service_healthy

  web:
    build: ../../web
    environment:
      ENGINE_URL: http://api:8000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-local-dev-only-0123456789}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@recosphere.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ENGINE_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}             # plain http on localhost/LAN; set 1 behind https
    volumes:
      - web-data:/app/data
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

  # ------------------------------------------------------------------------------------------ obs
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [obs]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [obs]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]            # 3000 is the web app
    depends_on: [prometheus]

volumes:
  web-data:
  redis-data:
