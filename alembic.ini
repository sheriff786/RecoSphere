# Alembic for the app database (app_api). The URL is NOT here: app_api/migrations/env.py reads
# DATABASE_URL_DIRECT (Neon's direct host, not the pooler) from the environment or app_api/.env.
#   python -m alembic upgrade head            (make db-upgrade)
#   python -m alembic revision --autogenerate -m "add x"
[alembic]
script_location = app_api/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
