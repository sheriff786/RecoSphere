# Phase 7g: every push / PR runs the unit tests and a full synthetic end-to-end smoke test
# (pipeline -> gate -> API -> parity -> A/B -> metrics). Real data never touches CI.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-ci.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: End-to-end smoke test (synthetic data)
        run: bash scripts/ci_smoke.sh
      - name: Compose config (core + every profile) via the Makefile
        run: make config
      - name: Promtool check (alert rules)
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/m" --entrypoint promtool prom/prometheus:v2.53.0 check rules /m/alerts.yml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx next build

  # P0: browser end to end (Playwright) on a throwaway synthetic stack: engine + standalone app, incl. roll back
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web + Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: E2E (synthetic engine + app + Playwright)
        run: make e2e-synthetic
      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
