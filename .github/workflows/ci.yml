# Phase 7g: every push / PR runs the unit tests and a full synthetic end-to-end smoke test
# (pipeline -> gate -> API -> parity -> A/B -> metrics). Real data never touches CI.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-ci.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Model registry on a real S3 server (SeaweedFS 4.52, same version as scripts/s3_local.sh)
        env:
          S3_ENDPOINT_URL: http://127.0.0.1:8333
          S3_ACCESS_KEY_ID: ci
          S3_SECRET_ACCESS_KEY: ci-only-secret-0123456789
          S3_BUCKET: recosphere
        run: |
          mkdir -p "$RUNNER_TEMP/s3"
          python -c "import json,os; json.dump({'identities':[{'name':'ci','credentials':[{'accessKey':os.environ['S3_ACCESS_KEY_ID'],'secretKey':os.environ['S3_SECRET_ACCESS_KEY']}],'actions':['Admin','Read','List','Tagging','Write']}]}, open(os.environ['RUNNER_TEMP']+'/s3/s3.json','w'))"
          docker run -d --name s3 -p 8333:8333 -v "$RUNNER_TEMP/s3:/conf" chrislusf/seaweedfs:4.52             mini -dir=/data -s3.config=/conf/s3.json -bucket=recosphere -admin.ui=false
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done
          python -m pytest -q tests/test_storage.py -k real_server -rs | tee "$RUNNER_TEMP/s3.txt"
          grep -q "1 passed" "$RUNNER_TEMP/s3.txt" || { echo "the real-server test did not run"; docker logs s3 | tail -40; exit 1; }
      - name: End-to-end smoke test (synthetic data)
        run: bash scripts/ci_smoke.sh
      - name: Compose config (core + every profile) via the Makefile
        run: make config
      - name: Promtool check (alert rules)
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/m" --entrypoint promtool prom/prometheus:v2.53.0 check rules /m/alerts.yml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx next build

  # P0: browser end to end (Playwright) on a throwaway synthetic stack: engine + standalone app, incl. roll back
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the app's user data lives in Postgres since P1 phase E: scripts/e2e_stack.sh creates a throwaway database
    # on this server (Alembic + synthetic catalog + admin) and drops it at the end
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      E2E_PG_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install Python (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web + Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: E2E (synthetic engine + app + Playwright)
        run: make e2e-synthetic
      - name: Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # P1: app DB migrations + every schema rule in DB_SCHEMA.md, on a throwaway Postgres 16 (never Neon:
  # no secret in CI). Runs migrate twice: the second run must be a no-op.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: recosphere
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/recosphere
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Migrate
        run: node db/migrate.mjs
      - name: Schema rules (DB_SCHEMA.md)
        run: node db/check_schema.mjs
      - name: Migrate again (must be a no-op)
        run: node db/migrate.mjs | tee /dev/stderr | grep -q "up to date"
      # app_api (P1 phase A): Alembic + SQLAlchemy models, on their own fresh database in the same container
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install app_api
        working-directory: .
        run: pip install -r requirements-app.txt pytest httpx
      - name: Create a fresh database for Alembic
        run: PGPASSWORD=ci psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE app_alembic"
      - name: Alembic upgrade head, then check (models == migrated schema)
        working-directory: .
        env:
          DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/app_alembic
          DATABASE_URL_DIRECT: postgresql://postgres:ci@127.0.0.1:5432/app_alembic
        run: |
          python -m alembic upgrade head
          python -m alembic current | grep -q "0001_baseline (head)"
          python -m alembic check
      - name: app_api tests (models vs 001_init.sql, migrations, /health)
        working-directory: .
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/app_alembic
        # only app_api: tests/test_api_doc.py imports the engine (torch, FAISS) and runs in job `test`
        run: python -m pytest -q tests/app_api
