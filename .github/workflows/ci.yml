# Phase 7g: every push / PR runs the unit tests and a full synthetic end-to-end smoke test
# (pipeline -> gate -> API -> parity -> A/B -> metrics). Real data never touches CI.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-ci.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: End-to-end smoke test (synthetic data)
        run: bash scripts/ci_smoke.sh
      - name: Promtool check (alert rules)
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint promtool prom/prometheus:v2.53.0 check rules /m/alerts.yml
